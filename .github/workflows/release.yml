name: Release build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      MP_VERSION: "1.3.83"
      MP_URL: "https://firmware.ardupilot.org/Tools/MissionPlanner/MissionPlanner-1.3.83.zip"
      MP_CACHE: "${{ github.workspace }}\\.ci\\mission-planner-1.3.83"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Prepare release metadata
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $productVersion = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($productVersion -notmatch '^\d+\.\d+\.\d+$') {
              throw "Release tag must use the vMAJOR.MINOR.PATCH format (for example, v1.2.3)."
            }
            $fileVersion = $env:GITHUB_REF_NAME
          } else {
            $productVersion = "0.0.$env:GITHUB_RUN_NUMBER"
            $fileVersion = "manual-$env:GITHUB_RUN_NUMBER"
          }
          $artifacts = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          New-Item -ItemType Directory -Force -Path $artifacts | Out-Null
          "PRODUCT_VERSION=$productVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FILE_VERSION=$fileVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_ARTIFACTS=$artifacts" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache Mission Planner 1.3.83
        id: mission-planner-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.MP_CACHE }}
          key: mission-planner-${{ runner.os }}-${{ env.MP_VERSION }}

      - name: Download Mission Planner build references
        if: steps.mission-planner-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "MissionPlanner-$env:MP_VERSION.zip"
          New-Item -ItemType Directory -Force -Path $env:MP_CACHE | Out-Null
          Invoke-WebRequest -Uri $env:MP_URL -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $env:MP_CACHE -Force

      - name: Locate Mission Planner
        shell: pwsh
        run: |
          $exe = Get-ChildItem -LiteralPath $env:MP_CACHE -Filter MissionPlanner.exe -Recurse |
            Select-Object -First 1
          if ($null -eq $exe) { throw "MissionPlanner.exe was not found in the downloaded archive." }
          "MISSION_PLANNER_PATH=$($exe.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build plugins and run tests
        shell: pwsh
        run: |
          .\telemetry-plugin\scripts\build.ps1 -MissionPlannerPath $env:MISSION_PLANNER_PATH -Configuration Release
          .\vision-hold-plugin\scripts\build.ps1 -MissionPlannerPath $env:MISSION_PLANNER_PATH -Configuration Release

      - name: Build plugins MSI
        shell: pwsh
        run: |
          dotnet build .\telemetry-plugin\installer\SarmatPlugin.Installer.wixproj `
            --configuration Release `
            "-p:ProductVersion=$env:PRODUCT_VERSION" `
            "-p:OutputPath=$env:RELEASE_ARTIFACTS"
          if ($LASTEXITCODE -ne 0) { throw "Plugins MSI build failed with exit code $LASTEXITCODE." }
          $built = Join-Path $env:RELEASE_ARTIFACTS "SarmatPlugins-$env:PRODUCT_VERSION.msi"
          $release = Join-Path $env:RELEASE_ARTIFACTS "SarmatPlugins-$env:FILE_VERSION.msi"
          if ($built -ne $release) { Move-Item -LiteralPath $built -Destination $release -Force }
          "PLUGIN_MSI=$release" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test and package Monitor
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          Push-Location .\monitor
          pnpm install --frozen-lockfile
          pnpm test
          if ($LASTEXITCODE -ne 0) { throw "Aggregator tests failed with exit code $LASTEXITCODE." }
          Pop-Location

          $stage = Join-Path $env:RUNNER_TEMP "monitor"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath .\monitor\src -Destination $stage -Recurse
          Copy-Item -LiteralPath .\monitor\public -Destination $stage -Recurse
          $sharedStage = Join-Path $stage "shared"
          New-Item -ItemType Directory -Force -Path $sharedStage | Out-Null
          Copy-Item -LiteralPath .\shared\telemetry-thresholds.json -Destination $sharedStage
          foreach ($file in @('package.json', 'pnpm-lock.yaml', 'config.example.json',
              'README.md', 'install.cmd', 'start.cmd')) {
            Copy-Item -LiteralPath (Join-Path .\monitor $file) -Destination $stage
          }
          $archive = Join-Path $env:RELEASE_ARTIFACTS "SarmatMonitor-$env:FILE_VERSION.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $archive -Force
          "MONITOR_ZIP=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monitor-release-${{ github.run_number }}
          path: |
            ${{ env.PLUGIN_MSI }}
            ${{ env.MONITOR_ZIP }}
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @($env:PLUGIN_MSI, $env:MONITOR_ZIP)
          if (gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release upload $env:GITHUB_REF_NAME $files --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:GITHUB_REF_NAME $files `
              --generate-notes --title "Sarmat Monitor $env:GITHUB_REF_NAME" `
              --repo $env:GITHUB_REPOSITORY
          }
