<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sarmat Monitor</title>
    <link rel="stylesheet" href="/app.css?v=7">
    <script type="module" src="/app.js?v=6"></script>
  </head>
  <body>
    <section id="login" class="login-card">
      <h1 class="brand login-brand" aria-label="SARMAT"><span class="brand-sar">SAR</span><span class="brand-mat">MAT</span></h1>
      <form id="login-form">
        <input id="secret" type="password" autocomplete="current-password" placeholder="Пароль" required autofocus>
        <button type="submit">Увійти</button>
      </form>
      <p id="login-error" class="login-error" role="alert"></p>
    </section>
    <main id="dashboard" hidden>
      <header id="dashboard-header">
        <h1 class="brand" aria-label="SARMAT"><span class="brand-sar">SAR</span><span class="brand-mat">MAT</span></h1>
        <div class="connection">
          <span id="connection-dot" role="status" aria-label="Підключення…" title="Підключення…"></span>
          <button id="hide-header" class="icon-button" type="button" title="Приховати хедер" aria-label="Приховати хедер">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M7 10l5 5 5-5M12 15V8"/></svg>
          </button>
          <button id="fullscreen" class="icon-button" type="button" title="Повний екран" aria-label="Повний екран">
            <svg class="fullscreen-enter" aria-hidden="true" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
            <svg class="fullscreen-exit" aria-hidden="true" viewBox="0 0 24 24"><path d="M8 3v5H3M16 3v5h5M8 21v-5H3M16 21v-5h5"/></svg>
          </button>
          <button id="logout" class="icon-button" type="button" title="Вийти" aria-label="Вийти">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 5H5v14h5M14 8l4 4-4 4M8 12h10"/></svg>
          </button>
        </div>
      </header>
      <button id="show-header" class="show-header icon-button" type="button" title="Показати хедер" aria-label="Показати хедер" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 18h16M7 14l5-5 5 5M12 9v7"/></svg>
      </button>
      <section class="table-card">
        <div class="column-controls">
          <button id="columns-button" class="columns-button" type="button" title="Налаштувати колонки" aria-label="Налаштувати колонки" aria-expanded="false">☰</button>
          <div id="columns-menu" class="columns-menu" hidden>
            <div class="columns-menu-title">Колонки</div>
            <div class="columns-menu-hint">Перетягуйте, щоб змінити порядок</div>
            <ul id="columns-list"></ul>
          </div>
        </div>
        <div class="table-scroll">
          <table>
            <thead><tr><th data-column="station">Станція</th><th data-column="status">Статус</th><th data-column="voltage">Напруга</th><th data-column="current">Струм</th><th data-column="satellites">Sat</th><th data-column="hdop">HDOP</th><th data-column="heading">Азимут</th><th data-column="altitude">Висота</th><th data-column="link">Зв'язок</th><th data-column="obs">OBS</th></tr></thead>
            <tbody id="stations"><tr><td colspan="10" class="empty">Очікування даних…</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
